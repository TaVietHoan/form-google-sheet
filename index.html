<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lưu dữ liệu vào Google Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full border border-slate-100">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Gửi Thông Tin</h2>

    <form id="myForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Họ và tên</label>
        <input type="text" id="name" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Email</label>
        <input type="email" id="email" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Nội dung</label>
        <textarea id="message" rows="3" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200">
        Gửi dữ liệu
      </button>
    </form>

    <!-- Thông báo kết quả -->
    <p id="statusMsg" class="mt-4 text-center text-sm font-semibold hidden"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
